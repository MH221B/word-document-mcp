[project]
name = "word-mcp"
version = "0.1.0"
description = "MCP server for reading and editing the Word document the user has open"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2", "pywin32>=306"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1"]

[project.scripts]
word-mcp = "word_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: requires a running Word instance"]
